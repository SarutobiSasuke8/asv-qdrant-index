[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asv-qdrant-index"
version = "0.2.0"
description = "Qdrant retrieval index over Agentic Satellite Vault engineering notes"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.9,<1",
    "qdrant-client>=1.15,<2",
    "python-frontmatter>=1.1,<2",
    "pyyaml>=6",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
asv-qdrant = "asv_qdrant.cli:main"
asv-qdrant-mcp = "asv_qdrant.mcp_server:main"

[tool.setuptools]
packages = ["asv_qdrant"]
